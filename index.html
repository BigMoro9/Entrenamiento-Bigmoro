<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bigmoro">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Dinámica Bigmoro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: '#1E1E1E',
                        background: '#121212',
                        primary: '#00E676', // Material Green accent
                        primaryDark: '#00C853',
                        error: '#CF6679'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <style>
        body { background-color: #121212; color: #FFFFFF; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); }
        /* Hide scrollbar for a cleaner mobile look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        input, select { background-color: #2C2C2C; color: white; }
        input:focus { outline: 1px solid #00E676; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
        
        /* Env safe area for modern phones */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Almacenamiento local (reemplaza a Firebase, que necesitaba credenciales que acá no existen) ---
        // Mantiene la misma interfaz (collection / doc / setDoc / updateDoc / deleteDoc / onSnapshot),
        // así el resto de la app queda exactamente igual.
        const appId = 'dinamica-bigmoro';
        const db = {};
        const STORE_PREFIX = 'bigmoro:';
        const listeners = {};
        const memoryStore = {};

        const readCol = (path) => {
            try {
                const raw = localStorage.getItem(STORE_PREFIX + path);
                return raw ? JSON.parse(raw) : {};
            } catch (e) { return memoryStore[path] || {}; }
        };
        const writeCol = (path, data) => {
            memoryStore[path] = data;
            try { localStorage.setItem(STORE_PREFIX + path, JSON.stringify(data)); } catch (e) { console.error(e); }
            (listeners[path] || []).forEach((fn) => fn());
        };
        const collection = (_db, ...segments) => ({ path: segments.join('/') });
        const doc = (ref, ...segments) => {
            if (ref === db) return { path: segments.slice(0, -1).join('/'), id: segments[segments.length - 1] };
            return { path: ref.path, id: segments[0] };
        };
        const setDoc = async (ref, data) => {
            const col = readCol(ref.path);
            col[ref.id] = data;
            writeCol(ref.path, col);
        };
        const updateDoc = async (ref, data) => {
            const col = readCol(ref.path);
            col[ref.id] = { ...(col[ref.id] || {}), ...data };
            writeCol(ref.path, col);
        };
        const deleteDoc = async (ref) => {
            const col = readCol(ref.path);
            delete col[ref.id];
            writeCol(ref.path, col);
        };
        const onSnapshot = (ref, onNext) => {
            const emit = () => {
                const col = readCol(ref.path);
                onNext({ forEach: (fn) => Object.keys(col).forEach((id) => fn({ id, data: () => col[id] })) });
            };
            (listeners[ref.path] = listeners[ref.path] || []).push(emit);
            emit();
            return () => { listeners[ref.path] = (listeners[ref.path] || []).filter((f) => f !== emit); };
        };
        const newId = () => (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

        // --- Constants & Quotes ---
        const MOTIVATIONAL_QUOTES = [
            // Bananirou & Memes
            "Un perdedor es un ganador que lo volvió a intentar. - Bananirou",
            "Respeten los rangos, por favor. - Bananirou",
            "Top 1 piques cortos. - Bananirou",
            "Ligero repunte del chasis. - Bananirou",
            "El chat está loco. - Bananirou",
            "Gg chat, no hay chance. - Bananirou",
            "La vida es un speedrun. - Bananirou",
            
            // Ingeniería, Física & Termodinámica
            "La energía no se crea ni se destruye, solo se transforma en torque. - 1ra Ley Termodinámica",
            "A toda acción siempre se opone una reacción igual y contraria... levantá esa barra. - 3ra Ley de Newton",
            "El esfuerzo (estrés) de hoy es la deformación plástica (hipertrofia) de mañana. - Resistencia de Materiales",
            "Dame un punto de apoyo y moveré el mundo. - Arquímedes",
            "La matemática es el alfabeto con el cual Dios ha escrito el universo. - Galileo Galilei",
            "Lo que no se define no se puede medir. Lo que no se mide, no se puede mejorar. - Lord Kelvin",
            "Si he logrado ver más lejos, ha sido porque he subido a hombros de gigantes. - Isaac Newton",
            "La fatiga de materiales es el precio a pagar por la resistencia estructural. - Ingeniería Mecánica",
            "Para inventar, necesitas una buena imaginación y una pila de chatarra. - Thomas Edison",
            "El motor no sabe de excusas, solo entiende de RPM y combustión. - Taller",
            "El trabajo es el producto de la fuerza por la distancia. Hacé el recorrido completo. - Física I",
            
            // Hércules Poirot / Agatha Christie
            "Orden y método, las pequeñas células grises deben trabajar. - Hércules Poirot",
            "La lógica rara vez es romántica, pero siempre es implacable. - Hércules Poirot",
            "Lo imposible no puede haber sucedido; por tanto, lo imposible debe ser posible a pesar de las apariencias. - Hércules Poirot",
            "El cerebro, amigo mío, es el músculo más importante de todos. - Hércules Poirot",

            // Marcelo Gallardo & Fútbol
            "Que la gente crea, porque tiene con qué creer. - Marcelo Gallardo",
            "Cierren los ojos, e imagínense... - Marcelo Gallardo",
            "No hay que bajar la guardia. Guardia alta siempre. - Marcelo Gallardo",
            "Elijo seguir estando porque es lo que me dicta el corazón. - Marcelo Gallardo",

            // Filosofía y Estoicismo
            "Lo que se interpone en el camino se convierte en el camino. - Marco Aurelio",
            "No nos atrevemos a muchas cosas porque son difíciles, pero son difíciles porque no nos atrevemos a hacerlas. - Séneca",
            "El hombre que sufre antes de que sea necesario, sufre más de lo necesario. - Séneca",
            "No te expliques, hazlo. - Epicteto",
            "La felicidad de tu vida depende de la calidad de tus pensamientos. - Marco Aurelio",
            "Ningún hombre es libre si no es dueño de sí mismo. - Epicteto",
            "A veces incluso vivir es un acto de valor. - Séneca",
            "El que tiene un porqué para vivir puede soportar casi cualquier cómo. - Friedrich Nietzsche",
            "Haz cada cosa en la vida como si fuera lo último que vayas a hacer. - Marco Aurelio",
            "Dominar a otros es fortaleza. Dominarte a ti mismo es el verdadero poder. - Lao-Tsé",

            // Estrategia Militar & Liderazgo
            "Si conoces al enemigo y te conoces a ti mismo, no debes temer el resultado de cien batallas. - Sun Tzu",
            "En medio del caos, también hay oportunidad. - Sun Tzu",
            "La victoria pertenece al más perseverante. - Napoleón Bonaparte",
            "Alejandro Magno no conquistó el mundo durmiendo hasta tarde. - Anónimo",
            "El coraje es aguantar el miedo un minuto más. - George S. Patton",
            "Si estás atravesando el infierno, sigue caminando. - Winston Churchill",
            "No interrumpas a tu enemigo cuando está cometiendo un error. - Napoleón Bonaparte",
            "Veni, vidi, vici. (Vine, vi, vencí). - Julio César",
            "El sudor ahorra sangre. - Erwin Rommel",
            
            // Disciplina, Fierros y Mentalidad
            "No te detengas cuando estés cansado. Detente cuando hayas terminado. - David Goggins",
            "El dolor es debilidad saliendo del cuerpo. - Cuerpo de Marines de EE.UU.",
            "Todo el mundo quiere ser culturista, pero nadie quiere levantar pesos pesados. - Ronnie Coleman",
            "La peor cosa que puedo ser es igual a los demás. - Arnold Schwarzenegger",
            "La disciplina es el puente entre las metas y los logros. - Jim Rohn",
            "Fallo mecánico o nada. - Ley de Hipertrofia",
            "Si duele, es porque el chasis se está soldando. - Taller Biomecánico",
            "La grasa llora cuando el chasis se mueve al fallo. - Taller Biomecánico",
            "No importa lo lento que vayas, siempre y cuando no te detengas. - Confucio",
            "La motivación te hace empezar. El hábito te hace continuar. - Jim Ryun",
            "Si no te desafía, no te cambia. - Fred DeVito"
        ];

        // --- Components ---

        // UI: Modal Wrapper
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
                    <div className="bg-surface rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col border border-neutral-700">
                        <div className="p-4 border-b border-neutral-800 flex justify-between items-center bg-neutral-900/50">
                            <h2 className="text-lg font-bold text-neutral-100">{title}</h2>
                            <button onClick={onClose} className="p-2 text-neutral-400 hover:text-white rounded-full bg-neutral-800">
                                <i className="ph-bold ph-x"></i>
                            </button>
                        </div>
                        <div className="p-5 max-h-[80vh] overflow-y-auto space-y-4">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [user, setUser] = useState(null);
            const [days, setDays] = useState([]);
            const [historyLogs, setHistoryLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState("");
            const [activeTab, setActiveTab] = useState('rutinas'); 
            const [quote, setQuote] = useState("");
            const [toast, setToast] = useState(null);

            // Modal States
            const [isDayModalOpen, setIsDayModalOpen] = useState(false);
            const [editingDay, setEditingDay] = useState(null);
            
            const [isExerciseModalOpen, setIsExerciseModalOpen] = useState(false);
            const [activeDayId, setActiveDayId] = useState(null);
            const [editingExercise, setEditingExercise] = useState(null);

            // Form States
            const [dayTitle, setDayTitle] = useState("");
            const [exName, setExName] = useState("");
            const [exWeight, setExWeight] = useState("");
            const [exSets, setExSets] = useState("");
            const [exReps, setExReps] = useState("");

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            // Init Effect
            useEffect(() => {
                setQuote(MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)]);

                setUser({ uid: 'local-user' });
            }, []);

            // Data Fetching Effect
            useEffect(() => {
                if (!user) return;

                // 1. Fetch Rutinas
                const daysRef = collection(db, 'artifacts', appId, 'users', user.uid, 'rutinas');
                const unsubscribeDays = onSnapshot(daysRef, (snapshot) => {
                    const fetchedDays = [];
                    snapshot.forEach((doc) => fetchedDays.push({ id: doc.id, ...doc.data() }));
                    fetchedDays.sort((a, b) => a.createdAt - b.createdAt);
                    setDays(fetchedDays);
                }, (err) => console.error(err));

                // 2. Fetch Historial
                const historyRef = collection(db, 'artifacts', appId, 'users', user.uid, 'historial');
                const unsubscribeHistory = onSnapshot(historyRef, (snapshot) => {
                    const fetchedHistory = [];
                    snapshot.forEach((doc) => fetchedHistory.push({ id: doc.id, ...doc.data() }));
                    fetchedHistory.sort((a, b) => b.timestamp - a.timestamp);
                    setHistoryLogs(fetchedHistory);
                    setLoading(false);
                }, (err) => {
                    console.error(err);
                    setError("Error de telemetría en la nube.");
                    setLoading(false);
                });

                return () => { unsubscribeDays(); unsubscribeHistory(); };
            }, [user]);

            // --- Handlers ---
            const handleSaveDay = async () => {
                if (!user || !dayTitle.trim()) return;
                try {
                    const daysRef = collection(db, 'artifacts', appId, 'users', user.uid, 'rutinas');
                    if (editingDay) {
                        await updateDoc(doc(daysRef, editingDay.id), { title: dayTitle });
                    } else {
                        await setDoc(doc(daysRef, Date.now().toString()), {
                            title: dayTitle,
                            createdAt: Date.now(),
                            exercises: []
                        });
                    }
                    setIsDayModalOpen(false);
                    setDayTitle("");
                    setEditingDay(null);
                } catch (err) { console.error(err); }
            };

            const handleDeleteDay = async (dayId) => {
                if (!user) return;
                try { await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'rutinas', dayId)); } 
                catch (err) { console.error(err); }
            };

            const openAddExercise = (dayId) => {
                setActiveDayId(dayId);
                setEditingExercise(null);
                setExName(""); setExWeight(""); setExSets("3"); setExReps("12");
                setIsExerciseModalOpen(true);
            };

            const openEditExercise = (dayId, exercise) => {
                setActiveDayId(dayId);
                setEditingExercise(exercise);
                setExName(exercise.name); setExWeight(exercise.weight); setExSets(exercise.sets); setExReps(exercise.reps);
                setIsExerciseModalOpen(true);
            };

            const handleSaveExercise = async () => {
                if (!user || !activeDayId || !exName.trim()) return;
                const day = days.find(d => d.id === activeDayId);
                if (!day) return;

                let updatedExercises = [...(day.exercises || [])];
                if (editingExercise) {
                    updatedExercises = updatedExercises.map(ex => 
                        ex.id === editingExercise.id ? { ...ex, name: exName, weight: exWeight, sets: exSets, reps: exReps } : ex
                    );
                } else {
                    updatedExercises.push({ id: newId(), name: exName, weight: exWeight, sets: exSets, reps: exReps });
                }

                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'rutinas', activeDayId), { exercises: updatedExercises });
                    setIsExerciseModalOpen(false);
                } catch (err) { console.error(err); }
            };

            const handleDeleteExercise = async (dayId, exerciseId) => {
                if (!user) return;
                const day = days.find(d => d.id === dayId);
                if (!day) return;
                const updatedExercises = (day.exercises || []).filter(ex => ex.id !== exerciseId);
                try { await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'rutinas', dayId), { exercises: updatedExercises }); } 
                catch (err) { console.error(err); }
            };

            const handleLogWorkout = async (day) => {
                if (!user || !day.exercises || day.exercises.length === 0) {
                    showToast("Cargá nafta al tanque antes de salir. No hay ejercicios.");
                    return;
                }
                
                try {
                    const historyRef = collection(db, 'artifacts', appId, 'users', user.uid, 'historial');
                    const logId = Date.now().toString();
                    await setDoc(doc(historyRef, logId), {
                        dayTitle: day.title,
                        timestamp: Date.now(),
                        exercises: day.exercises
                    });
                    showToast("¡Registro de chasis guardado con éxito!");
                } catch (err) {
                    console.error(err);
                    showToast("Error al guardar datos.");
                }
            };

            const formatDate = (timestamp) => {
                const date = new Date(timestamp);
                return date.toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
            };

            // --- Render ---
            if (loading) {
                return (
                    <div className="flex h-screen items-center justify-center flex-col bg-background">
                        <i className="ph-bold ph-engine animate-pulse text-5xl text-primary mb-4"></i>
                        <p className="text-neutral-400 font-medium tracking-wide uppercase text-sm">Calibrando sensores...</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-28 bg-background selection:bg-primary/30">
                    {/* App Bar */}
                    <header className="bg-surface shadow-[0_4px_20px_rgba(0,0,0,0.5)] sticky top-0 z-10 border-b border-neutral-800">
                        <div className="px-5 py-4">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="bg-primary text-neutral-900 p-2 rounded-xl shadow-[0_0_15px_rgba(0,230,118,0.3)]">
                                    <i className="ph-bold ph-wrench text-xl"></i>
                                </div>
                                <h1 className="text-xl font-black tracking-tight text-white uppercase">Dinámica <span className="text-primary">Bigmoro</span></h1>
                            </div>
                            <div className="text-xs text-neutral-300 italic border-l-2 border-primary pl-3 py-1 font-serif leading-relaxed opacity-90">
                                "{quote}"
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="p-4 max-w-md mx-auto space-y-6">
                        {error && (
                            <div className="bg-error/10 border border-error/50 text-error p-3 rounded-xl text-sm flex items-center gap-3 font-medium">
                                <i className="ph-fill ph-warning-circle text-lg"></i> {error}
                            </div>
                        )}

                        {/* RUTINAS TAB */}
                        {activeTab === 'rutinas' && (
                            <div className="space-y-6 animate-[slideUp_0.2s_ease-out]">
                                {days.length === 0 ? (
                                    <div className="text-center py-16 px-4 text-neutral-500 border-2 border-dashed border-neutral-800 rounded-2xl bg-surface/50">
                                        <i className="ph-fill ph-wrench text-5xl mb-3 opacity-40 text-primary"></i>
                                        <p className="font-medium">Taller inactivo. Creá tu primer día de entrenamiento.</p>
                                    </div>
                                ) : (
                                    days.map((day) => (
                                        <div key={day.id} className="bg-surface rounded-3xl overflow-hidden shadow-xl border border-neutral-800 mb-6 group">
                                            {/* Day Header */}
                                            <div className="bg-neutral-800/60 p-5 flex justify-between items-center border-b border-neutral-800/80">
                                                <h2 className="text-lg font-black text-white uppercase tracking-wide">{day.title}</h2>
                                                <div className="flex gap-2">
                                                    <button onClick={() => { setEditingDay(day); setDayTitle(day.title); setIsDayModalOpen(true); }} className="p-2.5 text-neutral-400 hover:text-primary bg-neutral-900 rounded-xl transition-colors">
                                                        <i className="ph-bold ph-pencil-simple"></i>
                                                    </button>
                                                    <button onClick={() => handleDeleteDay(day.id)} className="p-2.5 text-neutral-400 hover:text-error bg-neutral-900 rounded-xl transition-colors">
                                                        <i className="ph-bold ph-trash"></i>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Exercises List */}
                                            <div className="p-4">
                                                {(!day.exercises || day.exercises.length === 0) ? (
                                                    <p className="text-sm text-neutral-500 text-center py-6">Sin cargas registradas.</p>
                                                ) : (
                                                    <ul className="space-y-3 mb-5">
                                                        {day.exercises.map((ex) => (
                                                            <li key={ex.id} className="flex items-center justify-between p-3.5 rounded-2xl bg-neutral-900/50 border border-neutral-800/50">
                                                                <div className="flex-1">
                                                                    <div className="font-bold text-neutral-200 text-sm md:text-base">{ex.name}</div>
                                                                    <div className="text-xs font-mono text-neutral-400 mt-1.5 flex gap-2">
                                                                        <span className="flex items-center gap-1.5 bg-neutral-800 px-2.5 py-1 rounded-md text-primary font-semibold">
                                                                            <i className="ph-fill ph-barbell"></i> {ex.weight || '0'} kg
                                                                        </span>
                                                                        <span className="flex items-center gap-1.5 bg-neutral-800 px-2.5 py-1 rounded-md">
                                                                            <i className="ph-bold ph-arrows-clockwise"></i> {ex.sets}x{ex.reps}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                                <div className="flex gap-1 ml-3">
                                                                    <button onClick={() => openEditExercise(day.id, ex)} className="p-2 text-neutral-500 hover:text-primary transition-colors">
                                                                        <i className="ph-fill ph-pencil-simple text-lg"></i>
                                                                    </button>
                                                                    <button onClick={() => handleDeleteExercise(day.id, ex.id)} className="p-2 text-neutral-500 hover:text-error transition-colors">
                                                                        <i className="ph-fill ph-minus-circle text-lg"></i>
                                                                    </button>
                                                                </div>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                )}
                                                
                                                <div className="space-y-3">
                                                    <button onClick={() => openAddExercise(day.id)} className="w-full py-3.5 border-2 border-dashed border-neutral-700 rounded-2xl text-neutral-400 hover:text-primary hover:border-primary hover:bg-primary/5 transition-all text-sm font-bold flex items-center justify-center gap-2 uppercase tracking-wide">
                                                        <i className="ph-bold ph-plus text-lg"></i> Cargar Ejercicio
                                                    </button>

                                                    <button onClick={() => handleLogWorkout(day)} className="w-full py-4 bg-primary text-neutral-950 font-black rounded-2xl hover:bg-primaryDark transition-all shadow-[0_0_20px_rgba(0,230,118,0.2)] flex items-center justify-center gap-2 uppercase tracking-wider text-sm">
                                                        <i className="ph-bold ph-check-circle text-xl"></i> Guardar Entrenamiento
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* HISTORIAL TAB */}
                        {activeTab === 'historial' && (
                            <div className="space-y-5 relative before:absolute before:inset-0 before:ml-[1.35rem] before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-primary/50 before:via-neutral-800 before:to-transparent pt-2 animate-[slideUp_0.2s_ease-out]">
                                {historyLogs.length === 0 ? (
                                     <div className="text-center py-16 px-4 text-neutral-500 relative z-10">
                                        <i className="ph-fill ph-clock-counter-clockwise text-5xl mb-3 opacity-30"></i>
                                        <p className="font-medium">No hay registros. El motor está frío.</p>
                                    </div>
                                ) : (
                                    historyLogs.map(log => (
                                        <div key={log.id} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                                            <div className="flex items-center justify-center w-11 h-11 rounded-full border-4 border-background bg-primary text-neutral-900 shadow-[0_0_10px_rgba(0,230,118,0.4)] shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                                                <i className="ph-bold ph-fire"></i>
                                            </div>
                                            <div className="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] p-5 rounded-3xl bg-surface border border-neutral-800/80 shadow-lg">
                                                <div className="flex flex-col gap-1 mb-4 border-b border-neutral-800 pb-3">
                                                    <h3 className="font-black text-white text-base tracking-wide">{log.dayTitle}</h3>
                                                    <span className="text-[11px] text-primary/80 font-mono font-bold uppercase">{formatDate(log.timestamp)}</span>
                                                </div>
                                                <div className="space-y-2">
                                                    {log.exercises && log.exercises.map(ex => (
                                                        <div key={ex.id} className="text-xs flex justify-between items-end bg-neutral-900/30 p-2 rounded-lg">
                                                            <span className="text-neutral-300 font-medium truncate pr-2">{ex.name}</span>
                                                            <span className="text-neutral-400 font-mono whitespace-nowrap"><span className="text-white font-bold">{ex.weight}kg</span> • {ex.sets}x{ex.reps}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-neutral-800 flex justify-around pb-safe z-40">
                        <button 
                            onClick={() => setActiveTab('rutinas')} 
                            className={`flex-1 pt-4 pb-5 flex flex-col items-center gap-1.5 transition-colors ${activeTab === 'rutinas' ? 'text-primary' : 'text-neutral-500 hover:text-neutral-300'}`}
                        >
                            <i className={`${activeTab === 'rutinas' ? 'ph-fill' : 'ph'} ph-barbell text-2xl`}></i>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Plan</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('historial')} 
                            className={`flex-1 pt-4 pb-5 flex flex-col items-center gap-1.5 transition-colors ${activeTab === 'historial' ? 'text-primary' : 'text-neutral-500 hover:text-neutral-300'}`}
                        >
                            <i className={`${activeTab === 'historial' ? 'ph-fill' : 'ph'} ph-chart-line-up text-2xl`}></i>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Historial</span>
                        </button>
                    </nav>

                    {/* FAB (Floating Action Button) for Adding Days */}
                    {activeTab === 'rutinas' && (
                        <button 
                            onClick={() => { setEditingDay(null); setDayTitle(""); setIsDayModalOpen(true); }}
                            className="fixed bottom-24 right-6 w-16 h-16 bg-primary text-neutral-900 rounded-2xl shadow-[0_8px_20px_rgba(0,230,118,0.4)] flex items-center justify-center hover:bg-primaryDark transition-all z-30 transform hover:scale-105 active:scale-95 rotate-3"
                        >
                            <i className="ph-bold ph-plus text-3xl"></i>
                        </button>
                    )}

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-neutral-800 border border-primary text-white px-5 py-3 rounded-full shadow-2xl z-50 text-sm flex items-center gap-2 toast-enter font-bold whitespace-nowrap">
                            <i className="ph-fill ph-info text-primary text-lg"></i> {toast}
                        </div>
                    )}

                    {/* --- Modals --- */}
                    <Modal isOpen={isDayModalOpen} onClose={() => setIsDayModalOpen(false)} title={editingDay ? "AJUSTAR DÍA" : "NUEVO DÍA"}>
                        <div>
                            <label className="block text-xs font-bold text-neutral-400 mb-2 uppercase tracking-wide">Nombre de la sesión</label>
                            <input type="text" value={dayTitle} onChange={(e) => setDayTitle(e.target.value)} placeholder="Ej: Día 1: Pecho y Espalda" className="w-full p-4 rounded-xl border border-neutral-700 bg-neutral-900 focus:border-primary focus:ring-1 focus:ring-primary transition-all font-medium" />
                        </div>
                        <button onClick={handleSaveDay} disabled={!dayTitle.trim()} className="w-full py-4 bg-primary text-neutral-950 font-black uppercase tracking-wider rounded-xl hover:bg-primaryDark disabled:opacity-50 transition-all mt-4">
                            {editingDay ? "Actualizar Plan" : "Crear Día"}
                        </button>
                    </Modal>

                    <Modal isOpen={isExerciseModalOpen} onClose={() => setIsExerciseModalOpen(false)} title={editingExercise ? "AJUSTAR CARGA" : "NUEVO EJERCICIO"}>
                        <div>
                            <label className="block text-xs font-bold text-neutral-400 mb-2 uppercase tracking-wide">Ejercicio</label>
                            <input type="text" value={exName} onChange={(e) => setExName(e.target.value)} placeholder="Ej: Press Banca" className="w-full p-4 rounded-xl border border-neutral-700 bg-neutral-900 focus:border-primary transition-all font-medium" />
                        </div>
                        <div className="grid grid-cols-3 gap-3">
                            <div>
                                <label className="block text-xs font-bold text-neutral-400 mb-2 uppercase tracking-wide">Peso (kg)</label>
                                <input type="number" inputMode="decimal" value={exWeight} onChange={(e) => setExWeight(e.target.value)} placeholder="0" className="w-full p-4 rounded-xl border border-neutral-700 bg-neutral-900 focus:border-primary transition-all font-mono font-bold text-center" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-neutral-400 mb-2 uppercase tracking-wide">Series</label>
                                <input type="number" inputMode="numeric" value={exSets} onChange={(e) => setExSets(e.target.value)} placeholder="3" className="w-full p-4 rounded-xl border border-neutral-700 bg-neutral-900 focus:border-primary transition-all font-mono font-bold text-center" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-neutral-400 mb-2 uppercase tracking-wide">Reps</label>
                                <input type="number" inputMode="numeric" value={exReps} onChange={(e) => setExReps(e.target.value)} placeholder="12" className="w-full p-4 rounded-xl border border-neutral-700 bg-neutral-900 focus:border-primary transition-all font-mono font-bold text-center" />
                            </div>
                        </div>
                        <button onClick={handleSaveExercise} disabled={!exName.trim()} className="w-full py-4 mt-2 bg-primary text-neutral-950 font-black uppercase tracking-wider rounded-xl hover:bg-primaryDark disabled:opacity-50 transition-all flex items-center justify-center gap-2">
                            <i className="ph-bold ph-floppy-disk text-lg"></i> {editingExercise ? "Guardar Ajustes" : "Agregar a la rutina"}
                        </button>
                    </Modal>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
